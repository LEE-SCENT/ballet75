<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>발레75 — 디자인 시스템</title>
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="stylesheet" href="./styles.css" />
<style>
  /* 갤러리 전용 — 컴포넌트 자체 스타일은 styles.css를 그대로 쓴다 */
  body { background: var(--surface-sub); }
  .gal { max-width: 1080px; margin: 0 auto; padding: 40px 24px 120px; }
  .gal__head { margin-bottom: 40px; }
  .gal__title { font-size: 32px; font-weight: 600; line-height: 1.3; color: var(--odile-900); }
  .gal__lead { margin-top: 8px; font-size: 14px; line-height: 1.6; color: var(--odile-600); }
  .gal__lead code { font-size: 13px; background: var(--odile-100); padding: 1px 5px; border-radius: 4px; }

  .grp { margin-top: 44px; }
  .grp__name {
    font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    color: var(--odile-500); padding-bottom: 10px; border-bottom: 1px solid var(--odile-200);
  }

  .item { margin-top: 28px; }
  .item__top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
  .item__name { font-size: 16px; font-weight: 600; color: var(--odile-900); }
  .item__node {
    font-size: 11px; font-weight: 500; color: var(--odile-600);
    background: var(--odile-100); padding: 2px 6px; border-radius: 5px;
  }
  .item__desc { font-size: 13px; line-height: 1.6; color: var(--odile-600); margin-bottom: 12px; }

  /* 컴포넌트가 놓이는 흰 캔버스 */
  .canvas {
    background: var(--surface); border-radius: 12px; padding: 20px;
    box-shadow: inset 0 0 0 1px var(--odile-200);
  }
  .canvas--sub { background: var(--surface-sub); box-shadow: none; }
  .canvas + .canvas { margin-top: 8px; }
  .canvas__label { font-size: 11px; color: var(--odile-500); margin-bottom: 10px; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .col { display: flex; flex-direction: column; gap: 12px; }
  .w430 { max-width: 430px; }

  /* 오버레이는 화면을 덮으므로 무대 안에 가둬서 보여준다 */
  .stage {
    position: relative; overflow: hidden; height: 460px;
    border-radius: 12px; background: var(--odile-200);
  }
  .stage .scrim { position: absolute; }
  .stage .sheet {
    position: absolute; left: 50%; right: auto; top: auto; bottom: 0;
    transform: translateX(-50%); width: 100%; max-width: 430px;
    max-height: 100%; border-radius: 16px 16px 0 0; padding: 32px 16px 16px;
    animation: none;
  }
  .stage .popup {
    position: absolute; inset: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 430px; max-height: 100%; border-radius: 0;
    box-shadow: none; animation: none;
  }
</style>
</head>
<body>
  <div class="gal" id="gal" aria-live="polite"></div>
  <script type="module" src="./src/gallery.js"></script>
</body>
</html>
